ket.  The Broad Index weights securities in the index based on float-adjusted market value. The Multifactor index utilize a rules-based methodology, weighted to provide a high level of four investment style factors.  For international exposures, more countries may be represented in the Broad Index.&quot;,&quot;performance.returns.standardYearlyNet&quot;:&quot;Annual w/ Sales Charge (%)&quot;,&quot;performance.returns.volatilitySourced&quot;:&quot;Standard Deviation (%)&quot;,&quot;performance.returnsCalendarChart.bmHatchingDateInfo&quot;:&quot;*Prior to {0}, the Fund used a different benchmark which is reflected in the benchmark data.&quot;,&quot;performance.returnsCalendarChart.fundHatchingDateInfo&quot;:&quot;*On {0}, the Fund changed its name and/or investment objective and policy.&quot;,&quot;performance.returnsCalendarChart.upper-diclaimer&quot;:&quot;This chart shows the product&amp;#39;s performance as the percentage loss or gain per year over the last {0} years.&quot;,&quot;performance.returnsCalendarChart.upper-diclaimer.with-bm&quot;:&quot;This chart shows the product’s performance as the percentage loss or gain per year over the last {0} years against its benchmark. It can help you to assess how the product has been managed in the past and compare it to its benchmark.&quot;,&quot;performance.tab.distributions&quot;:&quot;&quot;,&quot;performance.tab.hypothetical&quot;:&quot;&quot;,&quot;performance.tab.premiumDiscount&quot;:&quot;&quot;,&quot;performance.tab.returns&quot;:&quot;&quot;,&quot;performance.title&quot;:&quot;Performance&quot;,&quot;premium-discount-chart.chart.description.infobubble&quot;:&quot;The above table and line graph present information about the differences between the daily closing price for shares of the fund and the fund’s net asset value.  The closing prices are determined by the fund’s listing exchange.  The vertical axis of the line graph shows the premium or discount expressed as a percentage of NAV.  The horizontal axis indicates the date at which the premium/discount occurred.  The table shows the number of trading days in which the fund traded at a premium, discount or at NAV.&quot;,&quot;premium-discount-chart.chart.timing.infobubble&quot;:&quot;Note on international funds:  The premiums and discount shown for international funds may be less accurate due to the differences in closing times between U.S. and international markets.  NAVs for most International funds are calculated by using closing securities prices from local markets and the Reuters/WM FX rates at 4:00 PM London Time.  Therefore, during the second part of the U.S. trading day, the NAVs for most international funds are frozen, yet the market prices for these funds continue to fluctuate to reflect new information.  As a result, for most international funds, the traditional measure of premium/discount (closing price/NAV) may be more reflective of different market hours than true trading premium/discounts.&quot;,&quot;premium-discount-chart.table.discount.infobubble&quot;:&quot;Number of trading days the ETF’s closing price is below the NAV.&quot;,&quot;premium-discount-chart.table.nav.infobubble&quot;:&quot;NAV is the price per share in which each fund issues and redeems shares.  It is calculated by the fund accountants in accordance with the standard formula for valuing mutual fund shares at the close of regular trading (normally 4:00 PM ET) every day the New York Stock Exchange is open.&quot;,&quot;premium-discount-chart.table.premium.infobubble&quot;:&quot;Number of trading days the ETF’s closing price exceeds its NAV.&quot;,&quot;premiumDiscount.description.infobubble&quot;:&quot;The above chart presents information about the difference between the daily market price for shares of the Fund and the Fund&amp;#39;s net asset value. The market price is determined using the midpoint between the highest bid and the lowest offer on the listing exchange, as of the time that the Fund&amp;#39;s NAV is calculated (usually 4:00 p.m. eastern time for most iShares Funds). The vertical axis of the chart shows the premium or discount expressed as a percentage of NAV. The horizontal axis indicates the number of trading days in the period covered by the chart.  Each bar in the chart shows the number of trading days in which the Fund traded within the premium/discount range indicated. IMPORTANT NOTE:  The horizontal bar for ≥ 0.0 up to 0.5 includes the days that the Fund’s market price matched its NAV (that is, there was no premium or discount so the &amp;quot;premium/discount&amp;quot; percentage equaled zero.)&quot;,&quot;premiumDiscount.discount.infobubble&quot;:&quot;The lowest amount the Fund traded below the reported NAV during the period.&quot;,&quot;premiumDiscount.navAmount.infobubble&quot;:&quot;NAV is the price per share at which each fund issues and redeems shares. It is calculated by the fund accountants in accordance with the standard formula for valuing mutual fund shares at the close of regular trading (normally 4:00 p.m. eastern time) every day the New York Stock Exchange is open.&quot;,&quot;premiumDiscount.premium.infobubble&quot;:&quot;The highest amount the Fund traded above the reported NAV during the period.&quot;,&quot;premiumDiscount.timing.infobubble&quot;:&quot;&amp;lt;p&amp;gt;Close of Trading Times: The NAV of BlackRock funds normally is calculated using prices as of 4:00 p.m. eastern time. Each BlackRock Fund normally trades on its respective stock exchange until 4:00 p.m. eastern time.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;Time of Last Trade: Trading generally takes place throughout the normal trading hours for BlackRock Funds on the listing exchange on which it is listed (generally 9:30 a.m. - 4:00 p.m. eastern time). At times, many trades are placed in rapid succession. At other times, little or no trading activity is taking place. It is important to note that the date/time of the last trade (which is recorded as the Closing Price) may not take place at exactly 4:00 p.m. eastern time when the BlackRock funds normally calculate NAV. The date/time of the last trade sometimes may occur before 4:00 p.m. eastern time. Thus, ongoing price discovery may result in a deviation between the price recorded as the Closing Price and the NAV of the fund shares calculated at 4:00 p.m. eastern time.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;Note on international funds: The premiums and discounts shown for international funds may be less accurate due to the difference in closing times between US and international markets. NAVs for most international BlackRock funds are calculated by using closing securities prices from local markets and Reuters/WM FX rates at 4 p.m. London time. Therefore, during the second part of the US trading day, the NAVs for most international BlackRock Funds are frozen, yet the market prices for these funds continue to fluctuate to reflect new information. As a result, for most international BlackRock Funds, the traditional measure of premium/discount (market price / NAV) may be more reflective of different market hours than true trading premium/discounts.&amp;lt;/p&amp;gt;&quot;,&quot;sr-only.pdf-tab&quot;:&quot;&quot;,&quot;literature.seeAllDocuments&quot;:&quot;See all documents&quot;,&quot;literature.title&quot;:&quot;Literature&quot;,&quot;literature.title.v3&quot;:&quot;&quot;,&quot;productLiteraturePalette.title&quot;:&quot;Documents&quot;,&quot;lipper-cons-ret.infobubble&quot;:&quot;{0} received the following Consistent Return ratings for the 3-, 5-, and 10-year periods, respectively: {8} ({5} funds), {9} ({6} funds), and {10} ({7} funds).&amp;lt;br /&amp;gt;&amp;lt;br /&amp;gt;Lipper ratings for Consistent Return reflect funds&amp;#39; historical risk-adjusted returns, adjusted for volatility, relative to peers.&quot;,&quot;lipper-expense.infobubble&quot;:&quot;{0} received the following Expense ratings for the 3-, 5-, and 10-year periods, respectively: {29} ({26} funds), {30} ({27} funds), and {31} ({28} funds).&amp;lt;br /&amp;gt;&amp;lt;br /&amp;gt;Lipper ratings for Expense reflect funds&amp;#39; expense minimization relative to peers with similar load structures.&quot;,&quot;lipper-preservation.infobubble&quot;:&quot;{0} received the following Preservation ratings for the 3-, 5-, and 10-year periods, respectively: {15} ({12} funds), {16} ({13} funds), and {17} ({14} funds).&amp;lt;br /&amp;gt;&amp;lt;br /&amp;gt;Lipper ratings for Preservation reflect funds&amp;#39; historical loss avoidance relative to other funds within the same asset class. Preservation ratings are relative, rather than absolute, measures, and funds named Lipper Leaders for Preservation may still experience losses periodically; those losses may be larger for equity and mixed equity funds than for fixed income funds.&quot;,&quot;lipper-tax-eff.infobubble&quot;:&quot;{0} received the following Tax Efficiency ratings for the 3-, 5-, and 10-year periods, respectively: {36} ({33} funds), {37} ({34} funds), and {38} ({35} funds).&amp;lt;br /&amp;gt;&amp;lt;br /&amp;gt;Lipper ratings for Tax Efficiency (US) reflect funds&amp;#39; historical success in postponing taxable distributions relative to peers. Tax Efficiency (US) offers no benefit to investors in tax-sheltered accounts such as retirement plans.&quot;,&quot;lipper-tot-ret.infobubble&quot;:&quot;{0} received the following Total Return ratings for the 3-, 5-, and 10-year periods, respectively: {22} ({19} funds), {23} ({20} funds), and {24} ({21} funds).&amp;lt;br /&amp;gt;&amp;lt;br /&amp;gt;Lipper ratings for Total Return reflect funds&amp;#39; historical total return performance relative to peers.&quot;,&quot;ratingsAndAwards.lipper.disclaimer&quot;:&quot;Overall Lipper Leaders ratings based on an equal-weighted average of percentile ranks for each measure over 3-, 5-, and 10-year periods (if applicable) and do not take into account the effects of sales charges for these categories (Consistent Return, Preservation, Total Return, Expense, and Tax Efficiency) as termines the Medalist Rating they’re assigned. Pillar ratings take the form of Low, Below Average, Average, Above Average, and High. Pillars may be evaluated via an analyst’s qualitative assessment (either directly to a vehicle the analyst covers or indirectly when the pillar ratings of a covered vehicle are mapped to a related uncovered vehicle) or using algorithmic techniques. Vehicles are sorted by their expected performance into rating groups defined by their Morningstar Category and their active or passive status. When analysts directly cover a vehicle, they assign the three pillar ratings based on their qualitative assessment, subject to the oversight of the Analyst Rating Committee, and monitor and reevaluate them at least every 14 months. When the vehicles are covered either indirectly by analysts or by algorithm, the ratings are assigned monthly. For more detailed information about these ratings, including their methodology, please go to global.morningstar.com/managerdisclosures/. The Morningstar Medalist Ratings are not statements of fact, nor are they credit or risk ratings. The Morningstar Medalist Rating (i) should not be used as the sole basis in evaluating an investment product, (ii) involves unknown risks and uncertainties which may cause expectations not to occur or to differ significantly from what was expected, (iii) are not guaranteed to be based on complete or accurate assumptions or models when determined algorithmically, (iv) involve the risk that the return target will not be met due to such things as unforeseen changes in management, technology, economic development, interest rate development, operating and/or material costs, competitive pressure, supervisory law, exchange rate, tax rates, exchange rate changes, and/or changes in political and social conditions, and (v) should not be considered an offer or solicitation to buy or sell the investment product. A change in the fundamental factors underlying the Morningstar Medalist Rating can mean that the rating is subsequently no longer accurate.&quot;,&quot;ratingsAndAwards.mstarAnalystRating.footnote.silver&quot;:&quot;Morningstar has awarded the Fund a Silver medal. (Effective {0})&quot;,&quot;ratingsAndAwards.mstarDataAvailabilityPct.title&quot;:&quot;Data Coverage %&quot;,&quot;ratingsAndAwards.mstarDataAvailabilityPct.title.infobubble&quot;:&quot;Data Coverage % is available input data for rating calculation at the Pillar level&quot;,&quot;ratingsAndAwards.mstarRatingOverall.infobubble&quot;:&quot;{0} received a Morningstar Rating of {5} stars for the 3-year period, {7} for the 5-year period and {9} for the 10-year period, rated against {6}, {8} and {10} {4} Funds, respectively. Performance results represent past performance and are no guarantee of future results.&amp;lt;br /&amp;gt;&amp;lt;br /&amp;gt;For each U.S.-domiciled fund with at least a 3-year history, Morningstar calculates a Morningstar RatingTM based on a Morningstar Risk-Adjusted Return measure that accounts for variation in a fund&amp;#39;s monthly performance (including the effects of sales charges, loads and redemption fees), placing more emphasis on downward variations and rewarding consistent performance. The top 10% of funds in each category receive five stars, the next 22.5% receive four stars, the next 35% receive three stars, the next 22.5% receive two stars and the bottom 10% receive one star. (Each share class is counted as a fraction of one fund within this scale and rated separately, which may cause slight variations in the distribution percentages.) The Overall Morningstar Rating for a fund is derived from a weighted-average of the performance figures associated with its 3-, 5- and 10-year (if applicable) Morningstar Rating metrics.&amp;lt;br /&amp;gt;&amp;lt;br /&amp;gt;Morningstar Ratings are for the share classes cited only; other classes may have different ratings.&quot;,&quot;ratingsAndAwards.mstarRatingOverall.notAvailable&quot;:&quot;no rating was provided&quot;,&  within a fund’s investment objective, the metrics do not change a fund’s investment objective or constrain the fund’s investable universe, and there is no indication that an ESG or Impact focused investment strategy or exclusionary screens will be adopted by a fund.&lt;/strong&gt; For more information regarding a fund&#x27;s investment strategy, please see the fund&#x27;s prospectus.&lt;/p&gt;\n&lt;p&gt;Review the MSCI methodologies behind Sustainability Characteristics using the links &lt;strong&gt;&lt;a href=\&quot;#esg-footer\&quot;&gt;below.&lt;/a&gt;&lt;/strong&gt;&lt;/p&gt;&quot;}],&quot;esg-analytics.subtitle-nsfl&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;&lt;p class=\&quot;fragment-mb\&quot;&gt;Sustainability Characteristics provide investors with specific non-traditional metrics. Alongside other metrics and information, these enable investors to evaluate funds on certain environmental, social and governance characteristics. Sustainability Characteristics do not provide an indication of current or future performance nor do they represent the potential risk and reward profile of a fund. They are provided for transparency and for information purposes only. Sustainability Characteristics should not be considered solely or in isolation, but instead are one type of information that investors may wish to consider when assessing a fund.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;&lt;a href=\&quot;#esg-footer\&quot;&gt;Review the MSCI methodologies behind Sustainability Characteristics.&lt;/a&gt;&lt;/strong&gt;&lt;/p&gt;&quot;}],&quot;esg-analytics.subtitle-sfl&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;&lt;p class=\&quot;fragment-mb\&quot;&gt;Sustainability Characteristics provide investors with specific non-traditional metrics. Alongside other metrics and information, these enable investors to evaluate funds on certain environmental, social and governance characteristics. Sustainability Characteristics do not provide an indication of current or future performance nor do they represent the potential risk and reward profile of a fund. They are provided for transparency and for information purposes only. Sustainability Characteristics should not be considered solely or in isolation, but instead are one type of information that investors may wish to consider when assessing a fund.&lt;/p&gt;\n&lt;p&gt;Review the MSCI methodologies behind Sustainability Characteristics using the links &lt;strong&gt;&lt;a href=\&quot;#esg-footer\&quot;&gt;below.&lt;/a&gt;&lt;/strong&gt;&lt;/p&gt;&quot;}],&quot;esg-analytics.temp-alignment.image&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;&lt;img class=\&quot;itr-image\&quot; src=\&quot;/global-content/images/media-bin/web/temp-alignment/en/temperature_image2x.png\&quot; alt=\&quot;Thermometer-style chart of yellow to red temperature bands showing an investment’s position relative to the Paris Agreement temperature goals. Metric data source MSCI\&quot; title=\&quot;Implied Temperature Rise Image\&quot; /&gt;&quot;}],&quot;esg-itr.bottom-text&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;&lt;p class=\&quot;emphasis\&quot;&gt;What are the key assumptions and limitations of the ITR metric?&lt;/p&gt;\n&lt;p&gt;This forward-looking metric is calculated based on a model, which is dependent upon multiple assumptions. Also, there are limitations with the data inputs to the model. Importantly, an ITR metric may vary meaningfully across data providers for a variety of reasons due to methodological choices (e.g., differences in time horizons, the scope(s) of emissions included and portfolio aggregation calculations).&lt;/p&gt;\n&lt;p&gt;\n&lt;span class=\&quot;bullet-point\&quot;&gt;There is not a universally accepted way to calculate an ITR.&lt;/span&gt;\n&lt;span class=\&quot;bullet-point\&quot;&gt;There is not a universally agreed upon set of inputs for the calculation.&lt;/span&gt;\n&lt;span class=\&quot;bullet-point\&quot;&gt;At present, availability of input data varies across asset classes and markets. To the extent that data becomes more readily available and more accurate over time, we expect that ITR metric methodologies will evolve and may result in different outputs. Funds may change bands as methodologies evolve. &lt;/span&gt;\n&lt;span class=\&quot;bullet-point\&quot;&gt;Where data is not available, and / or if data changes, the estimation methods vary, particularly those related to a company’s future emissions.&lt;/span&gt;\n&lt;/p&gt;\n&lt;br /&gt;\n&lt;p class=\&quot;emphasis\&quot;&gt;The ITR metric estimates a fund’s alignment with the Paris Agreement temperature goal based on a\ncredibility assessment of stated decarbonization targets. However, there is no guarantee that these estimates will be reached. The ITR metric is not a real time estimate and may change over time, therefore it is prone to variance and may not always reflect a current estimate.&lt;/p&gt;\n&lt;br /&gt;\n&lt;p class=\&quot;emphasis\&quot;&gt;The ITR metric is not an indication or estimate of a fund’s performance or risk. Investors should not rely on this metric when making an investment decision and instead should refer to a fund’s prospectus and governing documents. This estimate and the associated information is not intended as a recommendation to invest in any fund, nor is it intended to indicate any correlation between a fund’s ITR metric and its future investment performance.&lt;/p&gt;&quot;}],&quot;esg-itr.top-text&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;&lt;p class=\&quot;emphasis\&quot;&gt;What is the Implied Temperature Rise (ITR) metric? Learn what the metric means, how it is calculated, and about the assumptions and limitations for this forward-looking climate-related metric.&lt;/p&gt;\n&lt;p&gt;To address climate change, many of the world&#x27;s major countries have signed the Paris Agreement. The temperature goal of the Paris Agreement is to limit global warming to well below 2°C above pre-industrial levels, and ideally 1.5 °C, which will help us avoid the most severe impacts of climate change.&lt;/p&gt;\n&lt;br /&gt;\n&lt;p class=\&quot;emphasis\&quot;&gt;What is the ITR metric?&lt;/p&gt;\n&lt;p&gt;The ITR metric is used to provide an indication of alignment to the temperature goal of the Paris Agreement for a company or a portfolio. ITR employs open source 1.55° C decarbonization pathways derived from the Network of Central Banks and Supervisors for Greening the Financial System (NGFS). These pathways can be regional and sector specific and set a net zero target of 2050, in line with GFANZ (Glasgow Financial Alliance for Net Zero) industry standards. We make use of this feature for all GHG scopes. This enhanced ITR model was implemented by MSCI on February 19, 2024.&lt;/p&gt;\n&lt;br /&gt;\n&lt;p class=\&quot;emphasis\&quot;&gt;How is the ITR metric calculated?&lt;/p&gt;\n&lt;p&gt;The ITR metric is calculated by looking at the current emissions intensity of companies within the fund&#x27;s portfolio as well as the potential for those companies to reduce its emissions over time. If emissions in the global economy followed the same trend as the emissions of companies within the fund&#x27;s portfolio, global temperatures would ultimately rise within this band.&lt;/p&gt;\n&lt;br /&gt;\n&lt;p&gt;Note, only corporate issuers are covered within the calculation. A summary explanation of MSCI’s methodology and assumptions for its ITR metric can be found &lt;a href=\&quot;https://www.msci.com/documents/1296102/27422075/ImpliedTemperatureRise-cfs-en.pdf\&quot;&gt;&lt;span class=\&quot;emphasis\&quot;&gt;here.&lt;/span&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;br /&gt;\n&lt;p&gt;Because the ITR metric is calculated in part by considering the potential for a company within the fund’s portfolio to reduce its emissions over time, it is forward-looking and prone to limitations. As a result, BlackRock publishes MSCI’s ITR metric for its funds in temperature range bands. The bands help to underscore the underlying uncertainty in the calculations and the variability of the metric.&lt;/p&gt;&quot;}],&quot;esg-stmt-10&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-100&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in combination with other information in the research phase of the investment process. This may include relevant third-party insights, as well as internal engagement commentary and input from BlackRock Investment Stewardship on governance issues. The Fund manager conducts regular portfolio reviews with the Risk and Quantitative Analysis group and with the Chief Investment Officers. These reviews include discussion, where appropriate, of the portfolio&#x27;s exposure to material ESG risks, as well as exposure to sustainability-related business involvements, climate-related metrics, and other factors.&quot;}],&quot;esg-stmt-101&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial research and screening, Investment Committee and monitoring phases of the investment process. This includes thematic environmental, social and governance information sourced from primary sources, which may be included in the underwriting process. The Investment Committee discloses relevant ESG reporting, where appropriate. The Fund manager conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include discussion of portfolio exposure to material environmental, social and governance risks, where appropriate.&quot;}],&quot;esg-stmt-102&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-103&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-11&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-12&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the sourcing, initial screening and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks associated with any specific investment opportunity. Where appropriate, identified ESG risks are highlighted in the Investment Committee materials and discussed at the relevant Investment Committee meetings. The Fund manager also includes environmental, social and governance considerations during post-investment monitoring as part of its periodic portfolio reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include discussion of the performance of the asset as well as portfolio exposure to material environmental, social and governance risks, where appropriate.&quot;}],&quot;esg-stmt-13&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-130&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund of Fund manager’s universe of potential investments consists of funds managed by BlackRock, which are subject to ESG considerations in combination with other information in the research and due diligence phase of the investment process if actively managed, and by third-party managers on the MASS recommended list. Creation of the recommended list includes consideration of ESG information about third-party managers where available. The Fund of Fund manager conducts regular portfolio risk reviews with Risk and Quantitative Analysis group, which include, where appropriate, discussion of the portfolio&#x27;s exposure to material ESG risks.&quot;}],&quot;esg-stmt-131&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager incorporates ESG considerations throughout the investment process&#x27; macro outlook, idea generation, implementation tools, portfolio construction, risk management, ongoing monitoring and reporting. All research ideas generated for the Fund consider the potential impact from ESG-associated risks when appropriate, and these are documented as part of the investment process. Idea implementation uses a wide range of building blocks, including active mutual funds, index funds, ETFs, direct securities, derivatives, and third-party funds. The Fund manager reviews research ideas and asset allocation on a regular basis and reassesses the building blocks utilized to access research ideas. The choice of building block may be informed by ESG considerations. For strategies with an explicit ESG objective, certain building blocks are used to comply with those guidelines. Where an ESG focused building block becomes available, it may be considered as a replacement for standard market exposure when appropriate. Both the extent and impact of screens and integration may be considered in the context of the investment objective / investment style of particular strategies. The Fund manager may also build bespoke thematic baskets of securities, which are subject to BlackRock baseline screens in the first instance and where appropriate, additional screening criteria. The Fund manager may use E, S, and G criteria such as headline ESG and carbon footprint during the reporting phase. These are sourced from Aladdin or directly from third-party data providers, where available. The Fund manager conducts regular risk reviews between the investment team and BlackRock&#x27;s Risk and Quantitative Analysis group as well as portfolio reviews with Chief Investment Officers. Where appropriate, these reviews include discussion of the portfolio&#x27;s exposure to material ESG risks, as well as exposure to sustainability-related business involvements, climate-related metrics, and other factors.&quot;}],&quot;esg-stmt-134&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Global Allocation Investment Team believes that a company&#x27;s ability to manage material environmental, social and governance (ESG) issues may be relevant to the company&#x27;s ability to sustain growth and generate value for shareholders over the long term, and thus ESG performance indicators are considered as part of the investment process. The team analyzes ESG data when conducting research and due diligence on new investments, and when monitoring existing investments within the portfolio. The team&#x27;s ongoing monitoring of the portfolio involves regular portfolio risk reviews with the Risk and Quantitative Analysis group. These reviews include discussion, where appropriate, of the portfolio&#x27;s exposure to material ESG risks, as well as exposure to sustainability-related business involvements, climate-related metrics, and other factors.&quot;}],&quot;esg-stmt-135&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the research, selection, monitoring and reporting phases of the investment process. This may include third-party and internal material considerations, as defined by the investment team, of ESG criteria. The Fund manager undergoes a rigorous research phase in the construction of internal ESG research signals, which highlight criteria such as environmental aspects, human capital or management quality. As part of this research, the Fund manager may conduct due diligence on ESG data providers. Once these signals have met the criteria necessary to be incorporated in the portfolio, they are considered, where applicable, as part of the investment decisions on an ongoing basis as part of a broader set of signals. The Fund manager additionally uses standardized ESG criteria (headline ESG ratings, carbon emissions intensity) during the reporting phase. These may be sourced internally or directly from third-party data providers and are featured in internal portfolio analytics. The Fund manager conducts regular portfolio risk reviews with Risk and Quantitative Analysis group. These reviews include discussion, where appropriate, of the portfolio&#x27;s exposure to material ESG risks, as well as exposure to sustainability-related business involvements, climate-related metrics, and other factors.&quot;}],&quot;esg-stmt-14&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial research and screening, Investment Committee and monitoring phases of the investment process. This includes thematic environmental, social and governance information sourced from primary sources, which may be included in the underwriting process. The Investment Committee discloses relevant ESG reporting, where appropriate. The Fund manager conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include discussion of portfolio exposure to material environmental, social and governance risks, where appropriate.&quot;}],&quot;esg-stmt-143&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager considers ESG information in the research, security selection and portfolio review stages of the investment process. The Fund manager conducts bi-weekly credit meetings, wherein each credit is examined through an internal relative value analysis, which contains qualitative governance considerations combined with environmental, societal and governance metrics derived from third-party data providers, where available. The Fund manager conducts regular portfolio risk reviews with Risk and Quantitative Analysis group. These reviews include discussion of the portfolio&#x27;s exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-144&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager considers ESG information in the research, security selection and portfolio review stages of the investment process. The Fund manager conducts bi-weekly credit meetings, wherein each credit is examined through an internal relative value analysis, which contains qualitative governance considerations combined with environmental, societal and governance metrics derived from third-party data providers, where available. The Fund manager conducts regular portfolio risk reviews with Risk and Quantitative Analysis group. These reviews include discussion of the portfolio&#x27;s exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-155&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager evaluates the fundamental and strategic aspects of securities in which the Fund may invest. This may include a detailed, comprehensive review and analysis of all aspects of the company, including ESG policies, when evaluating opportunities. The Fund manager&#x27;s deep due diligence informs a holistic perspective on a given issuer and may impact the investment decision. Additionally, on a regular basis the Fund manager conducts portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include discussion of the portfolio&#x27;s exposure to material ESG risks, as well as exposure to sustainability-related business involvements, climate-related metrics, and other factors, where appropriate.&quot;}],&quot;esg-stmt-156&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks associated with any specific investments, co-investments and funds of funds opportunities. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-162&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund of Fund manager’s universe of potential investments consists of funds managed by BlackRock, which are subject to ESG considerations in combination with other information in the research and due diligence phase of the investment process if actively managed, and by third-party managers on the MASS recommended list. Creation of the recommended list includes consideration of ESG information about third-party managers where available. The Fund of Fund manager conducts regular portfolio risk reviews with Risk and Quantitative Analysis group, which include, where appropriate, discussion of the portfolio&#x27;s exposure to material ESG risks.&quot;}],&quot;esg-stmt-163&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations throughout the investment process, including sourcing, screening, due diligence, decision, and portfolio monitoring. This may include documented ESG screens preventing the Fund from investing in companies that are engaged in specified excluded sectors. In the due diligence process, the investment team uses an internal ESG risk assessment to identify, analyze and document key ESG risks where appropriate. Where applicable, the Fund manager may also consider third-party ESG data vendors or specialist consultants to support due diligence or company engagement. Potential investments are assigned an ESG rating where appropriate that reflects positive ESG attributes and material ESG risks, if any. Where appropriate, identified ESG risks and relevant mitigating actions may be documented in Investment Committee materials and discussed at relevant Investment Committee meetings. ESG criteria may impact the Investment Committee’s investment decision. The Fund’s ongoing portfolio management process includes, where appropriate, the monitoring of ESG criteria over the life of an investment, and in these cases Fund managers aim to refresh portfolio company ESG ratings on a quarterly basis. Furthermore, the investment team and BlackRock’s Risk and Quantitative Analysis group analyze exposure to material ESG risks where appropriate as part of the portfolio risk review regularly.&quot;}],&quot;esg-stmt-165&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager considers ESG information in the portfolio review stage of the investment process. The Fund manager conducts regular portfolio risk reviews between the investment team and BlackRock&#x27;s Risk and Quantitative Analysis group. These reviews include discussion, where appropriate, of portfolio exposure to material environmental, social and governance risks.&quot;}],&quot;esg-stmt-167&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations throughout the investment process, including sourcing, screening, due diligence, decision, and portfolio monitoring. This may include documented ESG screens preventing the Fund from investing in companies that are engaged in specified excluded sectors. In the due diligence process, the investment team uses an internal ESG risk assessment to identify, analyze and document key ESG risks where appropriate. Where applicable, the Fund manager may also consider third-party ESG data vendors or specialist consultants to support due diligence or company engagement. Potential investments are assigned an ESG rating where appropriate that reflects positive ESG attributes and material ESG risks, if any. Where appropriate, identified ESG risks and relevant mitigating actions may be documented in Investment Committee materials and discussed at relevant Investment Committee meetings. ESG criteria may impact the Investment Committee’s investment decision. The Fund’s ongoing portfolio management process includes, where appropriate, the monitoring of ESG criteria over the life of an investment, and in these cases Fund managers aim to refresh portfolio company ESG ratings on a quarterly basis. Furthermore, the investment team and BlackRock’s Risk and Quantitative Analysis group analyze exposure to material ESG risks where appropriate as part of the portfolio risk review regularly.&quot;}],&quot;esg-stmt-168&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the investment research, portfolio construction, and investment monitoring phases of the investment process. The Fund manager maintains internal ESG scorecards for certain issuers under consideration for investment and certain existing issuers of publicly traded securities. These scorecards analyze and track internal and external research views across a range of environmental, social, and governance factors sourced from primary and third-party ESG information and research. Portfolio management teams may consider the sector and issuer ESG views and scores during portfolio construction. The Fund manager also considers ESG criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include discussion of the portfolio&#x27;s exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-171&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-172&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks. It also may include the analysis of investment opportunities that may disproportionately contribute to climate change. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-174&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the initial screening, sourcing and due diligence phases of the investment process. This may include the use of internal ESG due diligence templates to identify, analyze and document key ESG risks. Specialist consultants may also be appointed to support due diligence. Where appropriate, identified ESG risks are highlighted in Investment Committee materials and discussed at relevant Investment Committee meetings. This information may broadly inform investment decisions: ESG criteria are considered in combination with other information. The Fund manager also considers environmental, social and governance criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include the analysis and discussion of portfolio exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-175&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in combination with other information in the research phase of the investment process. This may include relevant third-party insights, as well as internal engagement commentary and input from BlackRock Investment Stewardship on governance issues. The Fund manager conducts regular portfolio reviews with the Risk and Quantitative Analysis group and with the Chief Investment Officers. These reviews include discussion, where appropriate, of the portfolio&#x27;s exposure to material ESG risks, as well as exposure to sustainability-related business involvements, climate-related metrics, and other factors.&quot;}],&quot;esg-stmt-178&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations throughout the investment process, including sourcing, screening, due diligence, decision, and portfolio monitoring. This may include documented ESG screens preventing the Fund from investing in companies that are engaged in specified excluded sectors. In the due diligence process, the investment team uses an internal ESG risk assessment to identify, analyze and document key ESG risks where appropriate. Where applicable, the Fund manager may also consider third-party ESG data vendors or specialist consultants to support due diligence or company engagement. Potential investments are assigned an ESG rating where appropriate that reflects positive ESG attributes and material ESG risks, if any. Where appropriate, identified ESG risks and relevant mitigating actions may be documented in Investment Committee materials and discussed at relevant Investment Committee meetings. ESG criteria may impact the Investment Committee’s investment decision. The Fund’s ongoing portfolio management process includes, where appropriate, the monitoring of ESG criteria over the life of an investment, and in these cases Fund managers aim to refresh portfolio company ESG ratings on a quarterly basis. Furthermore, the investment team and BlackRock’s Risk and Quantitative Analysis group analyze exposure to material ESG risks where appropriate as part of the portfolio risk review regularly.&quot;}],&quot;esg-stmt-179&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations throughout the investment process, including sourcing, screening, due diligence, decision, and portfolio monitoring. This may include documented ESG screens preventing the Fund from investing in companies that are engaged in specified excluded sectors. In the due diligence process, the investment team uses an internal ESG risk assessment to identify, analyze and document key ESG risks where appropriate. Where applicable, the Fund manager may also consider third-party ESG data vendors or specialist consultants to support due diligence or company engagement. Potential investments are assigned an ESG rating where appropriate that reflects positive ESG attributes and material ESG risks, if any. Where appropriate, identified ESG risks and relevant mitigating actions may be documented in Investment Committee materials and discussed at relevant Investment Committee meetings. ESG criteria may impact the Investment Committee’s investment decision. The Fund’s ongoing portfolio management process includes, where appropriate, the monitoring of ESG criteria over the life of an investment, and in these cases Fund managers aim to refresh portfolio company ESG ratings on a quarterly basis. Furthermore, the investment team and BlackRock’s Risk and Quantitative Analysis group analyze exposure to material ESG risks where appropriate as part of the portfolio risk review regularly.&quot;}],&quot;esg-stmt-186&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;Within its Solutions platform, the Fund manager determines strategic asset class exposures using climate-aware capital markets assumptions. For open architecture accounts, the Fund manager conducts assessments for third-party active managers as part of an approval process. This assessment may consider whether managers have dedicated ESG resources or use internal ESG data, as well as the degree to which ESG is integrated into their investment processes. For equity managers, the Fund manager may also consider the strength of investment stewardship capabilities. The Fund manager may consider the ESG assessment alongside other relevant information from the Investment Due Diligence when selecting new active managers. The Fund manager may incorporate strategies with ESG-aligned investment objectives where appropriate for the portfolio and consistent with client objectives, including by designing custom ESG building blocks where feasible and appropriate. The Fund manager conducts regular portfolio risk reviews between the investment team and BlackRock&#x27;s Risk and Quantitative Analysis group. These reviews include discussion of portfolio exposure to material environmental, social and governance risks, where appropriate. In addition, the Fund manager may be invested in underlying funds or strategies that align to an ESG or sustainability orientation objective where appropriate and consistent with client objectives.&quot;}],&quot;esg-stmt-189&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the investment research, portfolio construction, and investment monitoring phases of the investment process. The Fund manager maintains internal ESG scorecards for certain issuers under consideration for investment and certain existing issuers of publicly traded securities. These scorecards analyze and track internal and external research views across a range of environmental, social, and governance factors sourced from primary and third-party ESG information and research. Portfolio management teams may consider the sector and issuer ESG views and scores during portfolio construction. The Fund manager also considers ESG criteria during post-investment monitoring and conducts regular portfolio risk reviews between the investment team and BlackRock’s Risk and Quantitative Analysis group. These reviews include discussion of the portfolio&#x27;s exposure to material ESG risks, where appropriate.&quot;}],&quot;esg-stmt-190&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;Within its Solutions platform, the Fund manager conducts assessments for third-party active managers as part of an approval process: this assessment considers whether managers have dedicated ESG resources or use internal ESG data, as well as the degree to which ESG is integrated into their investment processes. For equity managers, the Fund manager also considers the strength of investment stewardship capabilities. The assessment results in an internal manager-specific ESG rating based on the level of ESG integration. The Fund manager considers these ratings when selecting new active managers. The Fund manager includes ESG criteria in Portfolio Construction Review meetings. The Fund manager reviews internal manager ESG ratings in manager research reviews. The Fund manager conducts regular portfolio risk reviews between the investment team and BlackRock&#x27;s Risk and Quantitative Analysis group. These reviews include discussion of portfolio exposure to material environmental, social and governance risks, where appropriate.&quot;}],&quot;esg-stmt-191&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;Within its Solutions platform, the Fund manager conducts assessments for third-party active managers as part of an approval process: this assessment considers whether managers have dedicated ESG resources or use internal ESG data, as well as the degree to which ESG is integrated into their investment processes. For equity managers, the Fund manager also considers the strength of investment stewardship capabilities. The assessment results in an internal manager-specific ESG rating based on the level of ESG integration. The Fund manager considers these ratings when selecting new active managers. The Fund manager includes ESG criteria in Portfolio Construction Review meetings. The Fund manager reviews internal manager ESG ratings in manager research reviews. The Fund manager conducts regular portfolio risk reviews between the investment team and BlackRock&#x27;s Risk and Quantitative Analysis group. These reviews include discussion of portfolio exposure to material environmental, social and governance risks, where appropriate.&quot;}],&quot;esg-stmt-195&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes environmental, social and/or governance considerations in the research, selection, monitoring and reporting phases of the investment process. This can include third-party data and material considerations, as defined by the investment team, of environmental, social or governance criteria. Where appropriate, the Fund manager undertakes rigorous research in the construction of internal research signals, which helps measure a company&#x27;s exposure to, and management of, transition risks and opportunities associated with the low-carbon economy, internal and external stakeholder metrics, and board quality and composition. These signals consider key performance indicators, as determined by the investment team, within the relevant ESG themes. Once these indicators have met the criteria necessary to be incorporated into the signal, this information may be incorporated into investment decisions on an ongoing basis. The Fund manager may additionally examine environmental exposures such as carbon emissions intensity and clean technology revenue during the reporting phase. These are sourced from Aladdin or directly from third-party data providers.&quot;}],&quot;esg-stmt-198&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the research and due diligence phases of the investment process. When appropriate, the Fund manager leverages third-party ESG rating data available in the Aladdin universe, including climate-related characteristics such as emissions intensity criteria. In certain LifePath products, ESG may help drive the decision on which indexes a particular product will employ. Where appropriate for the portfolio, ESG Optimized or ESG Screened building blocks may be employed over standard market capitalized index exposures. Both the extent and impact of optimized and screened solutions are assessed for suitability in the context of the investment objective of the strategy. The Fund manager includes standardized ESG criteria (headline ESG ratings, emissions intensity) in the portfolio review and monitoring phase(s) of the investment process. This includes ESG criteria sourced from Aladdin and from third-party data providers. ESG reporting is included as part of quarterly performance reviews and periodic risk reviews with BlackRock&#x27;s Risk and Quantitative Analysis group.&quot;}],&quot;esg-stmt-199&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in combination with other information in the research phase of the investment process. This may include relevant third-party insights, as well as internal engagement commentary and input from BlackRock Investment Stewardship on governance issues. The Fund manager conducts regular portfolio reviews with the Risk and Quantitative Analysis group and with the Chief Investment Officers. These reviews include discussion, where appropriate, of the portfolio&#x27;s exposure to material ESG risks, as well as exposure to sustainability-related business involvements, climate-related metrics, and other factors.&quot;}],&quot;esg-stmt-200&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager determines the asset allocation strategy and then considers ESG information during the due diligence, security selection and portfolio monitoring phases of the investment process relative to each respective asset class or sector. This analysis may include internal and third-party information. The Fund manager conducts regular portfolio risk reviews between the investment team and BlackRock&#x27;s Risk and Quantitative Analysis group as well as portfolio reviews with Chief Investment Officers. Where appropriate, these reviews include discussion of the portfolio&#x27;s exposure to material ESG risks, as well as exposure to sustainability-related business involvements, climate-related metrics, and other factors.&quot;}],&quot;esg-stmt-201&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the research and due diligence phases of the investment process. The Fund manager leverages third-party ESG rating data available in the Aladdin universe, including climate-related characteristics such as emissions intensity criteria. In certain LifePath products, ESG helps drive the decision on which indexes a particular product will employ. The Fund manager includes standardized ESG criteria (such as, among others, headline ESG ratings and emissions intensity) in the portfolio review and monitoring phase(s) of the investment process. This may include ESG criteria sourced from Aladdin and from third-party data providers, where available. ESG reporting is included as part of quarterly performance reviews and periodic risk reviews with BlackRock&#x27;s Risk and Quantitative Analysis group.&quot;}],&quot;esg-stmt-203&quot;:[{&quot;metadata&quot;:null,&quot;text&quot;:&quot;The Fund manager includes ESG considerations in the research phase of the investment process. This can include third party material. During due diligence, the ESG vendor&#x27;s methodologies are analyzed to get a full understanding of its materiality and representativeness criteria. Where appropriate, the Fund manager includes ESG criteria in the selection process to identify ESG Best-in-Class approaches intended to tilt the ESG portfolio exposure to higher ESG ratings. Monitoring may include allocation adjustment based on ESG characteristic changes and company engagement in key Environmental, Social and Governance elements. In these circumstances, the Fund manager employs internal and third-party tools to keep track of ESG improvements, analyze execution and results, and follow up with companies regarding ESG issues. The Fund manager conducts regular portfolio risk reviews between the investment team and
